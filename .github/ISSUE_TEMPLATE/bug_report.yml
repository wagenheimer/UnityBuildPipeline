name: Bug report
description: Something is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Unity version, package version and reproduction steps are essential.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the package
        2. Open the dashboard
        3. Click ...
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: "6000.0.32f1 / 2022.3.62f1"
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package version
      description: See package.json, the Package Hub card or the Releases page.
      placeholder: "1.2.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform(s)
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - WebGL
        - Other
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or stack trace
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context